version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pharmacy-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PharmacyAdminPass2026!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - pharmacy-network

  auth-service:
    build:
      context: .
      dockerfile: src/Services/AuthService/Dockerfile
    container_name: pharmacy-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Pharmacy_UserDB;User Id=sa;Password=PharmacyAdminPass2026!;TrustServerCertificate=True
    ports:
      - "5001:5001"
    depends_on:
      - sqlserver
    networks:
      - pharmacy-network

  inventory-service:
    build:
      context: .
      dockerfile: src/Services/InventoryService/Dockerfile
    container_name: pharmacy-inventory-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Pharmacy_InventoryDB;User Id=sa;Password=PharmacyAdminPass2026!;TrustServerCertificate=True
    ports:
      - "5002:5002"
    depends_on:
      - sqlserver
    networks:
      - pharmacy-network

  order-service:
    build:
      context: .
      dockerfile: src/Services/OrderService/Dockerfile
    container_name: pharmacy-order-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Pharmacy_OrderDB;User Id=sa;Password=PharmacyAdminPass2026!;TrustServerCertificate=True
      - ServiceUrls__InventoryService=http://inventory-service:5002
      - ServiceUrls__AuthService=http://auth-service:5001
    ports:
      - "5003:5003"
    depends_on:
      - sqlserver
      - inventory-service
    networks:
      - pharmacy-network

  payment-service:
    build:
      context: .
      dockerfile: src/Services/PaymentService/Dockerfile
    container_name: pharmacy-payment-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Pharmacy_PaymentDB;User Id=sa;Password=PharmacyAdminPass2026!;TrustServerCertificate=True
    ports:
      - "5004:5004"
    depends_on:
      - sqlserver
    networks:
      - pharmacy-network

  salereport-service:
    build:
      context: .
      dockerfile: src/Services/SaleReportService/Dockerfile
    container_name: pharmacy-salereport-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Pharmacy_SaleReportDB;User Id=sa;Password=PharmacyAdminPass2026!;TrustServerCertificate=True
      - ServiceUrls__OrderService=http://order-service:5003
      - ServiceUrls__InventoryService=http://inventory-service:5002
    ports:
      - "5005:5005"
    depends_on:
      - sqlserver
      - order-service
    networks:
      - pharmacy-network

networks:
  pharmacy-network:
    driver: bridge

volumes:
  sqlserver-data:
